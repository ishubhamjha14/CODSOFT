<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Titanic AI Predictor</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

</head>

<body>

    <!-- VIDEO BACKGROUND -->
    <video autoplay muted loop playsinline id="bg-video">

        <source src="./assets/bg.mp4" type="video/mp4">

    </video>

    <!-- DARK OVERLAY -->
    <div class="video-overlay"></div>

    <!-- PARTICLES -->
    <div id="particles-js"></div>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- LEFT -->
        <div class="left-section" data-aos="fade-right">

            <h1 class="main-title">
                TITANIC AI
            </h1>

            <p class="tagline">
                Predict survival probability using Machine Learning
            </p>

            <div class="line"></div>

            <p class="description">

                Experience a cinematic AI-powered Titanic survival prediction system
                with majestic visuals, smooth animations, real-time predictions,
                and immersive Titanic aesthetics.

            </p>

        </div>

        <!-- RIGHT -->
        <div class="glass-card" data-aos="zoom-in">

            <h2>Passenger Details</h2>

            <div class="input-group">

                <label>Passenger Class</label>

                <select id="pclass">

                    <option value="1">First Class</option>

                    <option value="2">Second Class</option>

                    <option value="3">Third Class</option>

                </select>

            </div>

            <div class="input-group">

                <label>Gender</label>

                <select id="sex">

                    <option value="0">Male</option>

                    <option value="1">Female</option>

                </select>

            </div>

            <div class="input-group">

                <label>Age</label>

                <input type="number" id="age" placeholder="Enter Age">

            </div>

            <div class="input-group">

                <label>Fare</label>

                <input type="number" id="fare" placeholder="Enter Fare">

            </div>

            <button onclick="predict()">

                🚢 Predict Survival

            </button>

            <div id="result-box"></div>

        </div>

    </div>

    <!-- FOOTER -->
    <footer>

        Developed by <span>Shubham Kumar Jha</span> 🚀

    </footer>

    <!-- PARTICLES -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <!-- JS -->
    <script src="script.js"></script>

</body>

</html>
